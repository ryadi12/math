
name: NoteScan Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NoteScan APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Generate Android folder
      - name: Generate Android project
        run: |
          cp -r lib /tmp/lib
          cp pubspec.yaml /tmp/pubspec.yaml

          flutter create . \
            --platforms=android \
            --org com.ecole \
            --project-name ecole_app

          rm -rf lib
          cp -r /tmp/lib lib
          cp /tmp/pubspec.yaml pubspec.yaml

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 6. Install Android SDK 36
      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36"

      # 7. Get dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 8. Update compileSdk for app and plugins
      - name: Fix compileSdk for all Android modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = []

          android_dir = Path("android")
          if android_dir.exists():
              files.extend(android_dir.rglob("build.gradle"))
              files.extend(android_dir.rglob("build.gradle.kts"))

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if pub_cache.exists():
              files.extend(pub_cache.glob("**/android/build.gradle"))
              files.extend(pub_cache.glob("**/android/build.gradle.kts"))

          updated = 0

          pattern = re.compile(
              r'^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).*$',
              re.MULTILINE
          )

          for file in set(files):
              content = file.read_text()
              new_content, count = pattern.subn(
                  lambda match: match.group(1) + "36",
                  content
              )

              if count:
                  file.write_text(new_content)
                  updated += count
                  print(f"Updated: {file}")

          if updated == 0:
              raise SystemExit("No compileSdk settings were updated")

          print(f"Successfully updated {updated} compileSdk settings to 36")
          PY

      # 9. Build Release APK
      - name: Build APK
        run: flutter build apk --release

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteScan-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
