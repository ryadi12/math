
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android folder
        run: |
          cp -r lib /tmp/lib
          cp pubspec.yaml /tmp/pubspec.yaml

          flutter create . --platforms=android --org com.ecole --project-name ecole_app

          rm -rf lib
          cp -r /tmp/lib lib
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Set Android compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          gradle = next((p for p in files if p.exists()), None)

          if gradle is None:
              raise SystemExit("Android Gradle file not found")

          content = gradle.read_text()

          content, count1 = re.subn(
              r'(?m)^(\s*)compileSdk\s*=\s*.*$',
              r'\1compileSdk = 36',
              content
          )

          content, count2 = re.subn(
              r'(?m)^(\s*)compileSdkVersion\s+.*$',
              r'\1compileSdkVersion 36',
              content
          )

          if count1 + count2 == 0:
              raise SystemExit("Could not find compileSdk setting")

          gradle.write_text(content)
          print(f"Updated {gradle} to compileSdk 36")
          PY

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ecole-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
